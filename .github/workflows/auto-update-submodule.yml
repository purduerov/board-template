name: 🔄 Auto-Update Library Submodule

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger button in GitHub Actions UI
  repository_dispatch:    # Triggered automatically when purdue-rov-kicad-lib updates
    types: [update-library]

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update submodule to latest master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git submodule update --remote --recursive
          
      - name: Commit and Push if updated
        run: |
          if git diff --quiet libs/purdue-rov-kicad-lib; then
            echo "Submodule is already up-to-date."
          else
            git add libs/purdue-rov-kicad-lib
            git commit -m "chore(submodule): auto-update purdue-rov-kicad-lib to latest master"
            git push origin master
          fi
