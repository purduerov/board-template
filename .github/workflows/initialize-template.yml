name: Initialize Templated Repository

on:
  push:
    branches: [ master, main ]

jobs:
  initialize-repo:
    # Run only in repos created from the template, not in board-template itself
    if: github.repository != 'purduerov/board-template'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Rename Project Files
        env:
          TARGET_REPO: ${{ github.repository }}
          TARGET_REF: ${{ github.ref }}
        run: |
          # Get the repository name (e.g. depth-sensor-board)
          REPO_NAME=$(echo "$TARGET_REPO" | cut -d'/' -f2)
          echo "Initializing project as: $REPO_NAME"

          # 1. Rename files if the default board-template files exist
          if [ -f "board-template.kicad_pro" ]; then
            mv board-template.kicad_pro "${REPO_NAME}.kicad_pro"
            mv board-template.kicad_sch "${REPO_NAME}.kicad_sch"
            mv board-template.kicad_pcb "${REPO_NAME}.kicad_pcb"
            [ -f "board-template.kicad_prl" ] && mv board-template.kicad_prl "${REPO_NAME}.kicad_prl"

            # 2. Update references inside the project files
            sed -i "s/board-template/${REPO_NAME}/g" "${REPO_NAME}.kicad_pro"
            [ -f "${REPO_NAME}.kicad_prl" ] && sed -i "s/board-template/${REPO_NAME}/g" "${REPO_NAME}.kicad_prl"

            # 3. Clean up this initialization workflow itself so it doesn't run again
            rm .github/workflows/initialize-template.yml

            # 4. Commit and push the renamed files
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: initialize project name to ${REPO_NAME} and cleanup template config"
            git push origin HEAD:$TARGET_REF
          else
            echo "Project already initialized or files already renamed."
          fi
